name: infra provisioning
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose Terraform action'
        required: true
        type: choice
        options:
          - apply
          - destroy
jobs:
  infra_setup:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
      - name: Terraform init
        run:  terraform init
        working-directory: terraform/template
      - name: Import existing projects if missing from state
        working-directory: terraform/template
        shell: bash
        run: |
          set -e

          if ! terraform state show \
            'module.project.google_project.project' >/dev/null 2>&1; then
            terraform import \
              'module.project.google_project.project' \
              'dev-infra-project44622'
          fi

          if ! terraform state show \
            'module.project-host.google_project.project' >/dev/null 2>&1; then
            terraform import \
              'module.project-host.google_project.project' \
              'host-project44622'
          fi
      - name: Terraform plan
        run: terraform plan
        working-directory: terraform/template
      - name: Terraform apply
        run: terraform apply -auto-approve
        working-directory: terraform/template
      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve
        working-directory: terraform/template
      
      
