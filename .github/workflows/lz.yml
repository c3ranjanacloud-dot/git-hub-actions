name: landing zone provisioning
on:
  pull_request :
    branches: 
      - 'demo'
  push:
    branches:
      - 'demo'
jobs:
  folder_setup:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
      - name: Terraform init
        run:  terraform init
        working-directory: terraform/template/lz_folder
      - name: Terraform plan
        run: terraform plan -input=false -var-file="dev.tfvars"
        working-directory: terraform/template/lz_folder
      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo' 
        run: terraform apply -auto-approve
        working-directory: terraform/template/lz_folder
  project_setup:
    needs: folder_setup
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
      - name: Terraform init
        run:  terraform init
        working-directory: terraform/template/lz_project
      - name: Terraform plan
        run: terraform validate
        working-directory: terraform/template/lz_project
      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo' 
        run: terraform apply -auto-approve
        working-directory: terraform/template/lz_project
  
      
