name: landing zone infra provisioning
on:
  pull_request:
    branches:
      - demo
    paths: 
      - 'terraform/template/lz_project/**'
  push:
    branches: 
      - demo
    paths: 
      - 'terraform/template/lz_project/**'
concurrency:
  group: tf-lz-project
  cancel-in-progress: false
jobs:
  project_setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/template/lz_project
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
      - name: Terraform init
        run:  terraform init
      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan
      - name: Terraform apply
        if: github.event_name == 'push' && github.ref_name == 'demo'
        run: terraform apply -auto-approve

  
      
